spring:
  application:
    name: day05-integration
  ai:
    mcp:
      client:
        request-timeout: 60s
        stdio:
          connections:
            filesystem:
              command: npx.cmd
              args:
                - "-y"
                - "@modelcontextprotocol/server-filesystem"
                - "${user.dir}/mcp-sandbox"
            youtube:
              command: node
              args:
                - "${user.dir}/scripts/youtube-channel-mcp.js"
              env:
                YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:}
                YOUTUBE_TRANSCRIPT_LANG: ko
    google:
      genai:
        chat:
          model: gemini-3.1-flash-lite
        api-key: ${GOOGLE_API_KEY}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    error:
      include-message: always
  datasource:
    url: jdbc:postgresql://localhost:5432/helpdesk
    username: helpdesk
    password: helpdesk


logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
